# DocSync - Test Profile
spring:
  datasource:
    url: jdbc:h2:mem:docsync-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

logging:
  level:
    com.docsync: DEBUG
    org.springframework.security: DEBUG

docsync:
  security:
    encryption-key: test-encryption-key-for-testing-only
    jwt-secret: test-only-jwt-secret-at-least-32-bytes-long
    access-token-ttl-minutes: 15
  github:
    webhook-secret: test-webhook-secret
  llm:
    provider: mock
    model: mock-model
    max-tokens: 4000
  repository:
    workspace-root: target/test-workspaces
    git-timeout-seconds: 30
  jobs:
    enabled: false
